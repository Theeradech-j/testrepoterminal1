<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Pastel Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="wrapper">

    <!-- Score/Level/Lines: left sidebar on desktop, top bar on mobile -->
    <div id="stats-bar">
      <div class="stat-item panel-box">
        <div class="panel-label">SCORE</div>
        <div class="panel-value" id="score">0</div>
      </div>
      <div class="stat-item panel-box">
        <div class="panel-label">LEVEL</div>
        <div class="panel-value" id="level">1</div>
      </div>
      <div class="stat-item panel-box">
        <div class="panel-label">LINES</div>
        <div class="panel-value" id="lines">0</div>
      </div>
    </div>

    <!-- Game canvas -->
    <div id="game-area">
      <canvas id="board" width="300" height="600"></canvas>
      <div id="overlay">
        <div id="overlay-text"></div>
        <button id="overlay-btn">START</button>
      </div>
    </div>

    <!-- Right panel: Next piece + keyboard controls -->
    <div id="right-panel">
      <div class="panel-box">
        <div class="panel-label">NEXT</div>
        <canvas id="next-canvas" width="120" height="120"></canvas>
      </div>
      <!-- Hidden on mobile -->
      <div class="panel-box controls-box" id="keyboard-hint">
        <div class="panel-label">CONTROLS</div>
        <div class="control-row"><kbd>←→</kbd> Move</div>
        <div class="control-row"><kbd>↑</kbd> Rotate</div>
        <div class="control-row"><kbd>↓</kbd> Soft drop</div>
        <div class="control-row"><kbd>↓↓</kbd> Hard drop</div>
        <div class="control-row"><kbd>P</kbd> Pause</div>
      </div>
    </div>

  </div>

  <!-- Touch controls: shown only on touch devices -->
  <div id="touch-controls">
    <div class="touch-row">
      <button class="touch-btn" id="btn-rotate">&#8679;<br><span>Rotate</span></button>
    </div>
    <div class="touch-row">
      <button class="touch-btn" id="btn-left">&#8678;</button>
      <button class="touch-btn" id="btn-soft">&#8681;</button>
      <button class="touch-btn" id="btn-right">&#8680;</button>
    </div>
    <div class="touch-row">
      <button class="touch-btn wide" id="btn-hard">&#9660;&#9660; HARD DROP</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
