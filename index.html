<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Pastel Tetris</title>
  <link rel="stylesheet" href="style.css?v=3" />
</head>
<body>

  <!-- MOBILE TOP BAR: stats + next piece (hidden on desktop) -->
  <div id="mobile-top">
    <div id="mini-stats">
      <div class="mini-stat"><div class="mini-label">SC</div><div class="mini-value" id="score-m">0</div></div>
      <div class="mini-stat"><div class="mini-label">LV</div><div class="mini-value" id="level-m">1</div></div>
      <div class="mini-stat"><div class="mini-label">LN</div><div class="mini-value" id="lines-m">0</div></div>
    </div>
    <div id="mini-next">
      <div class="mini-label">NEXT</div>
      <canvas id="next-canvas-mobile" width="60" height="60"></canvas>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="app">

    <!-- Desktop left sidebar -->
    <div id="side-left">
      <div class="panel-box"><div class="panel-label">SCORE</div><div class="panel-value" id="score">0</div></div>
      <div class="panel-box"><div class="panel-label">LEVEL</div><div class="panel-value" id="level">1</div></div>
      <div class="panel-box"><div class="panel-label">LINES</div><div class="panel-value" id="lines">0</div></div>
    </div>

    <!-- Game canvas -->
    <div id="game-area">
      <canvas id="board" width="300" height="600"></canvas>
      <div id="overlay">
        <div id="overlay-text"></div>
        <button id="overlay-btn">START</button>
      </div>
    </div>

    <!-- Desktop right sidebar -->
    <div id="side-right">
      <div class="panel-box">
        <div class="panel-label">NEXT</div>
        <canvas id="next-canvas" width="120" height="120"></canvas>
      </div>
      <div class="panel-box controls-box">
        <div class="panel-label">CONTROLS</div>
        <div class="control-row"><kbd>←→</kbd> Move</div>
        <div class="control-row"><kbd>↑</kbd> Rotate</div>
        <div class="control-row"><kbd>↓</kbd> Soft drop</div>
        <div class="control-row"><kbd>↓↓</kbd> Hard drop</div>
        <div class="control-row"><kbd>P</kbd> Pause</div>
      </div>
    </div>

  </div>

  <!-- TOUCH CONTROLS (hidden on desktop) -->
  <div id="touch-controls">
    <div class="touch-row">
      <button class="touch-btn" id="btn-rotate">&#8679;</button>
    </div>
    <div class="touch-row">
      <button class="touch-btn" id="btn-left">&#8678;</button>
      <button class="touch-btn" id="btn-soft">&#8681;</button>
      <button class="touch-btn" id="btn-right">&#8680;</button>
    </div>
    <div class="touch-row">
      <button class="touch-btn wide" id="btn-hard">&#9660;&#9660;</button>
    </div>
  </div>

  <script src="game.js?v=3"></script>
</body>
</html>
